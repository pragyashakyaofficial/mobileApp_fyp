name: React Native CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2

    - name: Set up Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '18'

    - name: Install dependencies
      run: yarn install

    - name: Run linter
      run: yarn lint

    - name: Run unit tests
      run: yarn test

    # TODO: Add steps for E2E tests with Detox

    - name: Build Android
      run: cd android && ./gradlew assembleRelease

    # TODO: Add steps for iOS build and deployment
